[project]
name = "jobapply"
version = "0.1.0"
description = "Self-hosted platform to find, analyse and track job applications in Singapore, with tailored CVs and cover letters."
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "fastapi>=0.142.2",
    "httpx",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pydantic-settings",
    "pypdf",
    "python-multipart>=0.0.32",
    "pyyaml",
    "sqlmodel",
    "trafilatura",
    "typer",
    "typst",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobapply = "jobapply.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII chars (French CLI messages)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
